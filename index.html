<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindAR iOS Test</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/dist/mindar-image.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body { margin:0; overflow:hidden; }
    #startButton {
      position: absolute;
      top:50%;
      left:50%;
      transform: translate(-50%, -50%);
      padding:20px 40px;
      font-size:20px;
      background-color:#007bff;
      color:white;
      border:none;
      border-radius:10px;
      cursor:pointer;
      z-index:10;
    }
  </style>
</head>
<body>

<button id="startButton">Start AR</button>

<a-scene
    id="ar-scene"
    mindar-image="imageTargetSrc: ./kats.mind; maxTrack: 1;"
    embedded
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: true"
    style="display:none; width:100vw; height:100vh;">

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
        <a-box color="orange" position="0 0.25 0" scale="0.5 0.5 0.5"
               animation="property: rotation; to: 0 360 0; loop: true; dur: 4000"></a-box>
    </a-entity>

</a-scene>

<script>
const startButton = document.getElementById('startButton');
const arScene = document.getElementById('ar-scene');

startButton.addEventListener('click', async () => {
    startButton.style.display = "none";
    arScene.style.display = "block";

    const sceneEl = document.querySelector('a-scene');
    const mindarSystem = sceneEl.systems['mindar-image'];

    // Ensure video plays inline on iOS
    mindarSystem.video.setAttribute('playsinline', true);

    try {
        await mindarSystem.start();
        console.log("MindAR started!");
    } catch (e) {
        console.error("MindAR failed to start:", e);
    }
});
</script>

</body>
</html>
