<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://rawgit.com/mayognaise/aframe-gif-shader/master/dist/aframe-gif-shader.min.js"></script>
  </head>

  <body>
    <a-scene 
      mindar-image="imageTargetSrc: ./targets.txt; autoStart: true; uiLoading: no;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <img id="benimaru" src="./Benimaru_GIF.gif">
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        
        <a-entity 
          geometry="primitive: plane; width: 1; height: 1;" 
          position="0 0 0" 
          material="shader: gif; src: #benimaru; transparent: true; opacity: 1;"
          animation="property: scale; from: 0 0 0; to: 1.2 1.2 1.2; dur: 1000; easing: easeOutBack">
        </a-entity>

      </a-entity>
    </a-scene>
  </body>
</html>
