<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web AR Template</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- AR.js for image tracking -->
  <script src="https://cdn.rawgit.com/AR-js-org/AR.js/3.3.2/aframe/build/aframe-ar-nft.js"></script>

  <style>
    body { margin:0; overflow:hidden; }
    #startButton {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 20px 40px;
      font-size: 20px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      z-index: 10;
    }
  </style>
</head>
<body>

<button id="startButton">Start AR</button>

<a-scene
    id="ar-scene"
    embedded
    vr-mode-ui="enabled: false"
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
    style="display:none; width:100vw; height:100vh;"
    renderer="logarithmicDepthBuffer: true;">

    <!-- Camera -->
    <a-camera position="0 0 0"></a-camera>

    <!-- Image target using NFT (replace 'marker' with your files) -->
    <a-nft
        type="nft"
        url="./marker"
        smooth="true"
        smoothCount="10"
        smoothTolerance="0.01"
        smoothThreshold="5">

        <!-- AR Content on top of marker -->
        <a-box
            position="0 0.25 0"
            rotation="0 0 0"
            scale="0.5 0.5 0.5"
            color="orange"
            animation="property: rotation; to: 0 360 0; loop: true; dur: 4000">
        </a-box>
    </a-nft>
</a-scene>

<script>
const startButton = document.getElementById('startButton');
const arScene = document.getElementById('ar-scene');

startButton.addEventListener('click', () => {
    startButton.style.display = 'none';
    arScene.style.display = 'block';
});
</script>

</body>
</html>
