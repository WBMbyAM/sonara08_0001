<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <style>
      /* This button is mandatory for iPhone/Android to 'wake up' the GIF */
      #startButton { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 999; padding: 15px 30px; background: #222; color: white; border: none; border-radius: 8px; font-weight: bold; }
    </style>
  </head>

  <body>
    <button id="startButton">CLICK TO START AR</button>

    <a-scene 
      mindar-image="imageTargetSrc: ./targets.txt; autoStart: false; uiLoading: no;" 
      color-space="sRGB" 
      renderer="colorManagement: true, physicallyCorrectLights" 
      vr-mode-ui="enabled: false" 
      device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <img id="benimaru" src="./leoburns.gif" crossorigin="anonymous">
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-image src="#leoburns" position="0 0 0" height="1" width="1" transparent="true"></a-image>
      </a-entity>
    </a-scene>

    <script>
      // This script waits for the click to launch the camera and textures
      const startButton = document.querySelector("#startButton");
      const sceneEl = document.querySelector("a-scene");
      
      startButton.addEventListener('click', () => {
        sceneEl.systems['mindar-image-system'].start(); // Start the AR
        startButton.style.display = "none"; // Hide button
      });
    </script>
  </body>
</html>
